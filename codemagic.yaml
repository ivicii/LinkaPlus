# Alternative macOS build (Codemagic) — same unsigned-IPA flow as the GitHub
# Actions workflow, for when GitHub's macOS minutes are exhausted.
# Free tier: ~500 min/month on an M-series mac. Connect this repo at
# codemagic.io (GitHub app) and this workflow is auto-detected.
workflows:
  ios-unsigned:
    name: LinkaPlus unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          set -eo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project LinkaPlus.xcodeproj || true
      - name: Build (no code signing)
        script: |
          set -o pipefail
          xcodebuild \
            -project LinkaPlus.xcodeproj \
            -scheme LinkaPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build
      - name: Package into .ipa
        script: |
          set -eo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LinkaPlus.app"
          test -d "$APP_PATH" || { echo "Build output missing at $APP_PATH"; exit 1; }
          rm -rf Payload LinkaPlus.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LinkaPlus.ipa Payload
          echo "Created LinkaPlus.ipa"
    artifacts:
      - LinkaPlus.ipa
    # To also e-mail the IPA to yourself, uncomment and add your address:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: false
