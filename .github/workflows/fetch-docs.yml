name: Fetch docs

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LINKA docs and post as commit comment
        run: |
          urls="
          https://docs.linkalock.com/docs/api-docs/overview-and-setup.md
          https://docs.linkalock.com/docs/api-docs/rest-api/remote-commands.md
          https://docs.linkalock.com/docs/api-docs/rest-api/response-codes.md
          https://docs.linkalock.com/docs/api-docs/rest-api/cellular-and-gps-setup.md
          https://docs.linkalock.com/docs/api-docs/rest-api/authentication.md
          https://docs.linkalock.com/docs/billing/quick-start.md
          "
          out=/tmp/docs.md
          : > "$out"
          for u in $urls; do
            echo "=====================================================" >> "$out"
            echo "### $u" >> "$out"
            body=$(curl -fsSL "$u" 2>/dev/null || echo "(fetch failed)")
            # .md URLs return clean markdown; keep raw (capped). Others: strip tags.
            case "$u" in
              *.md) printf "%s" "$body" | head -c 6000 >> "$out" ;;
              *) printf "%s" "$body" | python3 -c "import sys,re,html; t=sys.stdin.read(); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(t); print(re.sub(r'\s+',' ',t)[:5000])" >> "$out" ;;
            esac
            echo "" >> "$out"
          done
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 63000 "$out")" >/dev/null && echo "posted"
