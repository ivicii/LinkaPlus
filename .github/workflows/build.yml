name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          echo "Active Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          set -eo pipefail
          if brew install xcodegen; then
            echo "xcodegen via brew"
          else
            echo "brew failed, downloading XcodeGen release binary"
            curl -fsSL -o xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
            unzip -q xcodegen.zip -d "$HOME/xcodegen-dist"
            echo "$HOME/xcodegen-dist/bin" >> "$GITHUB_PATH"
          fi

      - name: Generate Xcode project
        run: |
          set -eo pipefail
          xcodegen --version || true
          xcodegen generate --spec project.yml
          echo "objectVersion: $(grep -m1 objectVersion LinkaPlus.xcodeproj/project.pbxproj | tr -d ' ;')"
          echo "Schemes:"
          xcodebuild -list -project LinkaPlus.xcodeproj || true

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project LinkaPlus.xcodeproj \
            -scheme LinkaPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee /tmp/build.log

      - name: Report build errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Collecting errors…"
          {
            echo "### Build failed — extracted errors"
            echo ""
            echo '```'
            grep -nE "error:|: error|The following build commands failed|Undefined symto|cannot find|no such module|is unavailable|Command .* failed" /tmp/build.log 2>/dev/null | tail -120 || echo "(no matching error lines; see tail below)"
            echo '```'
            echo ""
            echo "<details><summary>Last 120 log lines</summary>"
            echo ""
            echo '```'
            tail -120 /tmp/build.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } > /tmp/report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/report.md)" >/dev/null && echo "Posted error report as commit comment."

      - name: Package into .ipa
        run: |
          set -eo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LinkaPlus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build output not found at $APP_PATH"; exit 1
          fi
          rm -rf Payload LinkaPlus.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LinkaPlus.ipa Payload
          echo "Created LinkaPlus.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkaPlus-unsigned-ipa
          path: LinkaPlus.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Commit IPA into dist/
        run: |
          set -eo pipefail
          mkdir -p dist
          cp LinkaPlus.ipa dist/LinkaPlus.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/LinkaPlus.ipa
          if git diff --cached --quiet; then
            echo "No IPA change"; exit 0
          fi
          git commit -m "Build: update dist/LinkaPlus.ipa [skip ci]"
          git push origin HEAD:main
