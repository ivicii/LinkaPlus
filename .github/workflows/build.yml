name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true
          echo "Files in repo root:"; ls -la

      - name: Install XcodeGen
        run: |
          set -eo pipefail
          if brew install xcodegen; then
            echo "xcodegen via brew"
          else
            echo "brew failed, downloading XcodeGen release binary"
            curl -fsSL -o xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
            unzip -q xcodegen.zip -d "$HOME/xcodegen-dist"
            echo "$HOME/xcodegen-dist/bin" >> "$GITHUB_PATH"
          fi

      - name: Generate Xcode project
        run: |
          set -eo pipefail
          xcodegen generate --spec project.yml
          echo "Schemes:"
          xcodebuild -list -project LinkaPlus.xcodeproj || true

      - name: Build (no code signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project LinkaPlus.xcodeproj \
            -scheme LinkaPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package into .ipa
        run: |
          set -eo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LinkaPlus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build output not found at $APP_PATH"; exit 1
          fi
          rm -rf Payload LinkaPlus.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LinkaPlus.ipa Payload
          echo "Created LinkaPlus.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkaPlus-unsigned-ipa
          path: LinkaPlus.ipa
          if-no-files-found: error
          retention-days: 30
