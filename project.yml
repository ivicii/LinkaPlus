name: LinkaPlus
options:
  bundleIdPrefix: com.ivoroo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios
    from: "23.0.0"
targets:
  LinkaPlus:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Widget/**"
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - package: Stripe
        product: StripePayments
      - target: LinkaPlusWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivoroo.linkaplus
        PRODUCT_NAME: LinkaPlus
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LinkaPlus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.ivoroo.linkaplus
            CFBundleURLSchemes:
              - linkaplus
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "LinkaPlus gebruikt Bluetooth om verbinding te maken met je LINKA-slot."
        NSLocationWhenInUseUsageDescription: "LinkaPlus toont de locatie van je slot op een kaart ten opzichte van waar je nu bent."
        NSAppTransportSecurity:
          NSExceptionDomains:
            linkalock.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionMinimumTLSVersion: "TLSv1.0"
              NSExceptionRequiresForwardSecrecy: false
  LinkaPlusWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivoroo.linkaplus.widget
        PRODUCT_NAME: LinkaPlusWidget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: LinkaPlus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  LinkaPlus:
    build:
      targets:
        LinkaPlus: all
        LinkaPlusWidget: all
    run:
      config: Release
