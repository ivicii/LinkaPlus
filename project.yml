name: LinkaPlus
options:
  bundleIdPrefix: com.ivoroo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  LinkaPlus:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivoroo.linkaplus
        PRODUCT_NAME: LinkaPlus
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LinkaPlus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "LinkaPlus gebruikt Bluetooth om verbinding te maken met je LINKA-slot."
        NSLocationWhenInUseUsageDescription: "LinkaPlus toont de locatie van je slot op een kaart ten opzichte van waar je nu bent."
        NSAppTransportSecurity:
          NSExceptionDomains:
            linkalock.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionMinimumTLSVersion: "TLSv1.0"
              NSExceptionRequiresForwardSecrecy: false
schemes:
  LinkaPlus:
    build:
      targets:
        LinkaPlus: all
    run:
      config: Release
